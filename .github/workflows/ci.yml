name: ci
on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared files are identical copies
        run: |
          diff recipes/lan-discovery/src/LanDiscovery.h   recipes/camera-stream/firmware/CameraStream/LanDiscovery.h
          diff recipes/lan-discovery/src/LanDiscovery.cpp recipes/camera-stream/firmware/CameraStream/LanDiscovery.cpp
          diff recipes/lan-discovery/host/lan_discovery.py recipes/camera-stream/dashboard/lan_discovery.py
      - name: Python compiles
        run: python -m py_compile recipes/lan-discovery/host/*.py recipes/camera-stream/dashboard/*.py recipes/camera-stream/tools/*.py
      - name: Host tests (no hardware)
        run: python -m unittest discover -s tests -v

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: ["esp32:esp32:esp32cam", "esp32:esp32:esp32"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: recipes/lan-discovery
          sketch-paths: |
            - recipes/lan-discovery/examples
            - recipes/camera-stream/firmware
